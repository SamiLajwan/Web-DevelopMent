<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>TABLES</h1>
    <table border="1">
        <tr>
            <th>S No</th>
            <th>Item </th>
            <th>Price</th>
            <th>Purchase</th>
        </tr> 
        <tr>
            <td>1</td>
            <td>Apple</td>
            <td>$1.99</td>
            <td>NO</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Mango</td>
            <td>$3</td>
            <td>YES</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Banana</td>
            <td colspan="2">$2</td>
            <td>YES</td>
        </tr>
        <tr>
            <td>4</td>
            <td rowspan="5">Litchi</td>
            <td >$2</td>
            <td>YES</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Banana</td>
            <td colspan="2">$2</td>
            <td>YES</td>
        </tr>
        <tr>
            <td>6</td>
            <td>Banana</td>
            <td colspan="2">$2</td>
            <td>YES</td>
        </tr>


    </table>
</body>
</html>
