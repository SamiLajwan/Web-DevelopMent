<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texts practice</title>
</head>
<body>
    <!-- bold text -->
    <p>My name is <b>Abdul Sami Lajwan</b></p>

    <!-- italic -->
     <p>My name is <i>Abdul Sami Lajwan</i></p>

    <!-- underline -->
      <p>My name is <u>Abdul Sami Lajwan</u></p>

    <!-- Strike through text -->
       <p>My name is <s>Abdul Sami Lajwan</s></p>

    <!-- to write in base -->
     <p>H<sub>2</sub>O</p>

     <!-- write as power through superScript-->
      <p>2<sup>n</sup></p>

    <!-- Combining Text formats-->
     <p>This is <b><i>Bold as well italic</i></b> too.</p>
</body>
</html>
